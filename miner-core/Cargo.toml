[package]
name = "miner-core"
version = "0.1.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
edition = "2021"
description = "Hardware independent mining logic of esp-miner-rs"
repository = "https://github.com/bitaxeorg/esp-miner-rs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bitcoin_hashes = { version = "0.14", default-features = false }
defmt = { version = "1.2.0", optional = true }
# kept on 0.8: jobs carry stratum-v1 0.1 heapless 0.8 types
heapless = { version = "0.8.0", default-features = false }

[dev-dependencies]
hex-literal = "1.0"

[features]
defmt = ["dep:defmt", "heapless/defmt-03"]
