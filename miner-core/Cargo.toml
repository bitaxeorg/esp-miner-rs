[package]
name = "miner-core"
version = "0.1.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
edition = "2021"
description = "Hardware independent mining logic of esp-miner-rs"
repository = "https://github.com/bitaxeorg/esp-miner-rs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
binary_sv2 = { version = "8.0", default-features = false }
bitcoin_hashes = { version = "1.2", default-features = false }
codec_sv2 = { version = "8.1", default-features = false, features = ["noise_sv2"] }
common_messages_sv2 = { version = "10.0", default-features = false }
defmt = { version = "1.2.0", optional = true }
embedded-io-async = "0.7"
framing_sv2 = { version = "9.0", default-features = false }
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
key-utils = { version = "1.2", default-features = false }
mining_sv2 = { version = "13.0", default-features = false }
noise_sv2 = { version = "2.1", default-features = false }
parsers_sv2 = { version = "0.7", default-features = false }
qrcodegen-no-heap = "1.8.1"
rand_core = "0.6"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7.0", default-features = false }

[dev-dependencies]
embassy-futures = "0.1"
hex-literal = "1.0"
key-utils = "1.2"
noise_sv2 = "2.1"
rand = "0.8"

[features]
defmt = ["dep:defmt", "heapless/defmt"]
