[target.xtensa-esp32s3-none-elf]
# runner = "espflash flash --monitor --log-format=defmt --no-stub"
runner = [
  "probe-rs",
  "run",
  "--idf-partition-table=partitions.csv",
  "--log-format={{t:dimmed} [{L:bold}]} {s}  {{c} {ff}:{l:1}%dimmed}",
]

[env]
DEFMT_LOG = "info"
# C dependencies (libsecp256k1, for the Stratum V2 handshake) are built for the chip
CC_xtensa_esp32s3_none_elf = "xtensa-esp32s3-elf-gcc"
AR_xtensa_esp32s3_none_elf = "xtensa-esp32s3-elf-ar"
CFLAGS_xtensa_esp32s3_none_elf = "-mlongcalls"

[build]
rustflags = [
  "-C",
  "link-arg=-Wl,-Tlinkall.x",
  "-C",
  "link-arg=-nostartfiles",
  "-C",
  "link-arg=-Tdefmt.x",
]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
