[package]
name = "esp-miner-rs"
version = "0.1.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
edition = "2021"
description = "Rust based firmware for the Bitaxe boards"
repository = "https://github.com/bitaxeorg/esp-miner-rs"
license = "MIT OR Apache-2.0"

keywords = ["embedded", "embedded-hal", "esp", "esp32s3", "no-std"]
categories = ["embedded", "no-std", "bitcoin"]

[dependencies]
bitcoin_hashes = { version = "1.2", default-features = false }
bm1366 = { version = "0.4.1", features = ["defmt"], optional = true }
bm1368 = { version = "0.4.1", features = ["defmt"], optional = true }
bm1370 = { version = "0.4.1", features = ["defmt"], optional = true }
bm1372 = { version = "0.4.1", features = ["defmt"], optional = true }
bm1397 = { version = "0.4.0", features = ["defmt"], optional = true }
bm13xx-chain = { version = "0.4.3", features = ["defmt"] }
bm13xx-protocol = { version = "0.4.0", features = ["defmt"] }
bounded-integer = "0.6"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
ds4432 = { version = "0.3.1", default-features = false, optional = true, features = [
    "async",
    "core-error",
    "defmt",
] }
edge-captive = { version = "0.8.0", default-features = false, features = ["io"] }
edge-dhcp = { version = "0.8.0", default-features = false, features = ["defmt", "io"] }
edge-mdns = { version = "0.8.0", default-features = false, features = ["defmt", "io"] }
edge-nal = "0.7.0"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = [
    "defmt",
    "medium-ethernet",
    "multicast",
    "proto-ipv4",
    "udp",
] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "dhcpv4",
    "dhcpv4-hostname",
    "dns",
    "multicast",
    "medium-ethernet",
    "tcp",
    "udp",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-io = "0.7.1"
embedded-storage = "0.3.1"
embedded-io-async = "0.7.0"
emc2101 = { version = "4.2.0", default-features = false, optional = true, features = [
    "async",
    "defmt",
] }
emc2103 = { version = "0.1.0", default-features = false, optional = true, features = [
    "async",
    "defmt",
] }
emc230x = { version = "0.8.0", optional = true }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
    "defmt",
    "esp32s3",
    "panic-handler",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "embedded-storage", "esp32s3"] }
esp-hal = { version = "1.2.2", features = ["defmt", "esp32s3", "unstable"] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "defmt",
    "esp-alloc",
    "esp32s3",
    "unstable",
    "wifi",
] }
esp-nvs = { version = "0.6.3", features = ["defmt"] }
esp-rtos = { version = "0.4.0", features = [
    "defmt",
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32s3",
] }
esp-storage = { version = "0.10.0", features = ["defmt", "embedded-storage", "esp32s3"] }
esp-wifi-sys-esp32s3 = "0.3.0"
fugit = "0.6.0"
heapless = { version = "0.9.3", default-features = false, features = ["defmt", "serde"] }
ina260 = { version = "0.4.0", features = [
    "defmt",
], git = "https://github.com/Georges760/ina260.git", rev = "30dd697cf20ab7fc1f6e55d22823adf18afc86b0", optional = true }
miner-core = { path = "../miner-core", features = ["defmt"] }
picoserve = { version = "0.21.0", features = ["defmt", "embassy"] }
pmbus-adapter = { version = "0.1.0", optional = true }
ssd1306 = { version = "0.10.0", optional = true, features = ["async"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7.0", default-features = false }
smbus-adapter = { version = "0.1.1", optional = true }
smoltcp = { version = "0.13.0", default-features = false, features = [
    "medium-ethernet",
    "proto-dhcpv4",
    "proto-ipv4",
    "socket-dhcpv4",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
static_cell = { version = "2.1.1", features = ["nightly"] }
stratum-v1 = { version = "0.5.0", features = ["defmt"] }
tmp1075 = { version = "0.2.0", default-features = false, optional = true, features = [
    "async",
] }
tps546 = { version = "0.1.0", optional = true }

[build-dependencies]
miniz_oxide = "0.8.9"

[features]
# A board by its number, as printed on it: exactly one (see src/board.rs). Each enables the
# board's parts listed at the end.
bitaxe-102 = ["asic-bm1397", "display-oled", "fan-emc2101", "vcore-dac"]
bitaxe-201 = ["asic-bm1366", "asic-temp-internal", "display-oled", "fan-emc2101", "vcore-dac"]
bitaxe-202 = ["asic-bm1366", "asic-temp-internal", "display-oled", "fan-emc2101", "vcore-dac"]
bitaxe-205 = ["asic-bm1366", "asic-temp-internal", "display-oled", "fan-emc2101", "vcore-dac"]
bitaxe-302 = ["asic-bm1366", "display-oled", "fan-emc2302", "vcore-tps546"]
bitaxe-303 = ["asic-bm1366", "display-oled", "fan-emc2302", "vcore-tps546"]
bitaxe-207 = ["asic-bm1366", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-400 = ["asic-bm1368", "asic-temp-internal", "display-oled", "fan-emc2101", "vcore-dac"]
bitaxe-401 = ["asic-bm1368", "asic-temp-internal", "display-oled", "fan-emc2101", "vcore-dac"]
bitaxe-402 = ["asic-bm1368", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-403 = ["asic-bm1368", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-600 = ["asic-bm1370", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-601 = ["asic-bm1370", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-602 = ["asic-bm1370", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-603 = ["asic-bm1370", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-650 = ["asic-bm1370", "display-oled", "fan-emc2101", "vcore-tps546"]
bitaxe-701 = ["asic-bm1368", "display-oled", "fan-emc2302", "vcore-tps546"]
bitaxe-702 = ["asic-bm1368", "display-oled", "fan-emc2302", "vcore-tps546"]
bitaxe-801 = ["asic-bm1370", "display-oled", "fan-emc2103", "vcore-tps546"]
bitaxe-1201 = [
    "asic-bm1372",
    "asic-enable",
    "display-st7789",
    "fan-emc2103",
    "pins-color",
    "vcore-tps546",
]
bitaxe-1300 = [
    "asic-bm1370",
    "asic-enable",
    "display-st7789",
    "fan-emc2103",
    "pins-color",
    "vcore-tps546",
]
# An ESP32-S3 module alone (no ASIC, regulator, fan or display): Wi-Fi, web interface, settings,
# OTA and pool session, for development. Its parts only give the types the web interface uses;
# none is driven.
devkit = ["asic-bm1370", "fan-emc2101", "vcore-tps546"]
# A board by its name: the latest revision of the family.
bitaxe-max = ["bitaxe-102"]
bitaxe-ultra = ["bitaxe-207"]
bitaxe-hex = ["bitaxe-303"]
bitaxe-supra = ["bitaxe-403"]
bitaxe-gamma = ["bitaxe-603"]
bitaxe-gamma-duo = ["bitaxe-650"]
bitaxe-supra-hex = ["bitaxe-702"]
bitaxe-gamma-turbo = ["bitaxe-801"]
bitaxe-naja-duo = ["bitaxe-1201"]
bitaxe-gamma-hex = ["bitaxe-1300"]
# Board parts, enabled by the board features above, not meant to be selected directly.
asic-bm1366 = ["dep:bm1366"]
asic-bm1368 = ["dep:bm1368"]
asic-bm1370 = ["dep:bm1370"]
# BM1372 or BM1373.
asic-bm1372 = ["dep:bm1372"]
asic-bm1397 = ["dep:bm1397"]
# ASIC power enable on GPIO10, active high, besides the TPS546.
asic-enable = []
# ASIC temperature from the EMC2101 internal sensor plus an offset, instead of the chip's diode.
asic-temp-internal = []
# SSD1306 OLED (128 × 32) on the I2C bus.
display-oled = ["dep:ssd1306"]
# ST7789 colour LCD (320 × 170) on the 8-bit i80 bus of LCD_CAM (boards with the colour display).
display-st7789 = []
fan-emc2101 = ["dep:emc2101"]
fan-emc2103 = ["dep:emc2103"]
# Two fans on an EMC2302, the temperature from two TMP1075 board sensors.
fan-emc2302 = ["dep:emc230x", "dep:tmp1075"]
# I2C on SDA GPIO44 / SCL GPIO43 (boards with the colour display) instead of GPIO47 / GPIO48.
pins-color = []
# TPS40305 buck moved by a DS4432 current DAC, INA260 on the input, PWR_EN.
vcore-dac = ["dep:ds4432", "dep:ina260"]
# TPS546D24A buck over PMBus.
vcore-tps546 = ["dep:pmbus-adapter", "dep:smbus-adapter", "dep:tps546"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1       # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = true
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
