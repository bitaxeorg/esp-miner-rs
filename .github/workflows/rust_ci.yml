name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/readme.md"
  pull_request:
  workflow_dispatch:

# Every job runs in the dev shell of flake.nix (the esp toolchain, also for the host checks). The
# Nix store is restored from the cache saved by the host checks.
# No WiFi credentials: the builds start their setup access point.
env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  firmware-build:
    name: Firmware Build (bitaxe-${{ matrix.board }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        # Every board number; the family names are aliases of some of them.
        board: [102, 201, 202, 205, 207, 302, 303, 400, 401, 402, 403, 600, 601, 602, 603, 650, 701, 702, 801, 1201, 1300]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: false
      - name: Enter the flake dev shell
        uses: nicknovitski/nix-develop@v1
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
          key: bitaxe-${{ matrix.board }}
      - name: Build
        run: cargo build --release --features=bitaxe-${{ matrix.board }}
      # the app image, for the update page of the web interface
      - name: Image
        run: >-
          espflash save-image --chip esp32s3 --flash-size 16mb --partition-table partitions.csv
          target/xtensa-esp32s3-none-elf/release/esp-miner-rs esp-miner-rs-bitaxe-${{ matrix.board }}.bin
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp-miner-rs-bitaxe-${{ matrix.board }}
          path: |
            firmware/target/xtensa-esp32s3-none-elf/release/esp-miner-rs
            firmware/esp-miner-rs-bitaxe-${{ matrix.board }}.bin
          if-no-files-found: error

  firmware-checks:
    name: Firmware Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: fmt
            args: --all -- --check --color always
          # One per code path: the family names, plus the DAC boards reading the EMC2101 internal
          # sensor.
          - command: clippy
            args: --features=bitaxe-max --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-ultra --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-supra --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-gamma --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-gamma-turbo --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-naja-duo --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-gamma-hex --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-gamma-duo --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-hex --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-supra-hex --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-205 --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-401 --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: false
      - name: Enter the flake dev shell
        uses: nicknovitski/nix-develop@v1
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  host-checks:
    name: Host Checks (miner-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
      - name: Enter the flake dev shell
        uses: nicknovitski/nix-develop@v1
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check --color always
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
