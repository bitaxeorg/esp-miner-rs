name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WIFI_SSID: TestSSID
  WIFI_PASSWORD: TestPASSWORD

jobs:
  firmware-build:
    name: Firmware Build (bitaxe-${{ matrix.board }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        # Every board number; the family names are aliases of some of them.
        board: [102, 201, 202, 205, 207, 400, 401, 402, 403, 600, 601, 602, 603, 801, 1201]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
          key: bitaxe-${{ matrix.board }}
      - name: Build
        run: cargo build --release --features=bitaxe-${{ matrix.board }}
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp-miner-rs-bitaxe-${{ matrix.board }}
          path: firmware/target/xtensa-esp32s3-none-elf/release/esp-miner-rs
          if-no-files-found: error

  firmware-checks:
    name: Firmware Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: fmt
            args: --all -- --check --color always
          # One per code path: the family names, plus the DAC boards reading the EMC2101 internal
          # sensor.
          - command: clippy
            args: --features=bitaxe-max --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-ultra --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-supra --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-gamma --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-gamma-turbo --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-naja-duo --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-205 --workspace -- -D warnings
          - command: clippy
            args: --features=bitaxe-401 --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  host-checks:
    name: Host Checks (miner-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check --color always
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
